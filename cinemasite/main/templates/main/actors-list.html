{% extends 'main/base.html' %}
{% load static %}

{% block title %}
	Actors
{% endblock %}

{% block body %}
	<h1>Actors</h1>

    <ul>
        {% for actor in actors %}
            <li>
                <a href="{% url 'main:actor_detail' actor_slug=actor.slug %}">{{ actor }}</a>
            </li>
            {% if actor.photo %}
                <img src="{{ actor.photo.url }}" width="200" alt="Photo {{ actor }}" style="border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);" />
            {% else %}
                <img src="{% static 'images/no-photo.png' %}" width="200" alt="No Photo" style="border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);" />
            {% endif %}
        {% endfor %}
    </ul>
{% endblock %}
